
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern POS - Receipt Queue</title>
    <link rel="stylesheet" href="css/pos.css">

    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .page-header-left h1 {
            margin: 0 0 6px;
            font-size: 28px;
            font-weight: 700;
        }

        .page-header-left p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .refresh-button {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .refresh-button:hover {
            background: #000;
        }

        .refresh-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        .summary-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
        }

        .summary-label {
            margin-bottom: 8px;
            color: #777;
            font-size: 13px;
            font-weight: 500;
        }

        .summary-value {
            color: #222;
            font-size: 26px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .queue-card {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
        }

        .queue-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .queue-card-header h2 {
            margin: 0 0 5px;
            font-size: 19px;
            font-weight: 700;
        }

        .queue-card-header p {
            margin: 0;
            color: #777;
            font-size: 13px;
        }

        .search-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 20px;
            border-bottom: 1px solid #eee;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 550px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 17px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 42px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: #333;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, .06);
        }

        .clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            border: none;
            background: transparent;
            color: #666;
            font-size: 21px;
            cursor: pointer;
        }

        .clear-search.visible {
            display: block;
        }

        .search-info {
            color: #777;
            font-size: 12px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 900px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px 18px;
            text-align: left;
            border-bottom: 1px solid #eee;
            white-space: nowrap;
        }

        th {
            background: #fafafa;
            color: #666;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        td {
            color: #333;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .customer-name {
            font-weight: 600;
            color: #222;
        }

        .sale-number {
            font-weight: 600;
            color: #333;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .2px;
        }

        .paid {
            color: #087a3d;
            background: #e8f7ef;
        }

        .partial {
            color: #7a35a8;
            background: #f3e8f8;
        }

        .pending {
            color: #b45309;
            background: #fef3c7;
        }

        .unknown {
            color: #475569;
            background: #e2e8f0;
        }

        .open-button {
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            background: #087a3d;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .open-button:hover {
            background: #066631;
        }

        .open-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .empty {
            padding: 45px 20px !important;
            text-align: center !important;
            color: #777;
            font-size: 14px;
            white-space: normal;
        }

        #message {
            padding: 0 20px 18px;
            color: #c0392b;
            font-size: 13px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        #message:empty {
            display: none;
        }

        @media (max-width: 900px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
            }

            .refresh-button {
                width: 100%;
            }

            .queue-card-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .search-area {
                align-items: stretch;
                flex-direction: column;
            }

            .search-box {
                max-width: none;
                width: 100%;
            }
        }

        @media (max-width: 500px) {
            .page-header-left h1 {
                font-size: 23px;
            }

            .summary-card {
                padding: 16px;
            }

            .queue-card-header,
            .search-area {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="pos-app">

    <aside id="posSidebar" class="pos-sidebar"></aside>

    <main class="pos-main">

        <header id="posTopbar" class="pos-topbar"></header>

        <div class="pos-content">

            <div class="page-header">

                <div class="page-header-left">
                    <h1>Receipt Queue</h1>
                    <p>Sales that are ready for receipt processing.</p>
                </div>

                <button
                    type="button"
                    class="refresh-button"
                    id="refreshQueueButton"
                >
                    Refresh Queue
                </button>

            </div>

            <div class="summary-grid">

                <div class="summary-card">
                    <div class="summary-label">Receipts Ready</div>
                    <div class="summary-value" id="receiptCount">0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-label">Fully Paid</div>
                    <div class="summary-value" id="paidCount">0</div>
                </div>

                <div class="summary-card">
                    <div class="summary-label">Total Amount</div>
                    <div class="summary-value" id="totalAmount">₦0.00</div>
                </div>

            </div>

            <div class="queue-card">

                <div class="queue-card-header">
                    <div>
                        <h2>Receipt Processing Queue</h2>
                        <p>Select a sale to view and generate its receipt.</p>
                    </div>
                </div>

                <div class="search-area">

                    <div class="search-box">

                        <span class="search-icon">⌕</span>

                        <input
                            type="search"
                            id="receiptSearch"
                            class="search-input"
                            placeholder="Search customer, sale number or payment status..."
                            autocomplete="off"
                            aria-label="Search receipt queue"
                        >

                        <button
                            type="button"
                            id="clearSearch"
                            class="clear-search"
                            aria-label="Clear search"
                            title="Clear search"
                        >×</button>

                    </div>

                    <span class="search-info" id="searchInfo">
                        Showing all receipts
                    </span>

                </div>

                <div class="table-wrapper">

                    <table>

                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Sale Number</th>
                                <th>Total</th>
                                <th>Paid</th>
                                <th>Balance</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="queueTable">
                            <tr>
                                <td colspan="7" class="empty">
                                    Loading receipt queue...
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

                <div id="message" role="status" aria-live="polite"></div>

            </div>

        </div>

    </main>

</div>

<script src="js/pos-layout.js"></script>

<script>
"use strict";

// =========================================
// API CONFIGURATION
// =========================================

const API_BASE_URL = "http://127.0.0.1:3000/api";
const RECEIPT_QUEUE_URL = `${API_BASE_URL}/receipts/queue`;

let receiptQueueCache = [];

// =========================================
// JWT AUTHENTICATION
// =========================================

function getAuthToken() {
    const token = localStorage.getItem("posToken");

    if (!token) {
        window.location.replace("login.html");

        throw new Error(
            "Your session is missing. Please log in again."
        );
    }

    return token;
}

async function apiFetch(url, options = {}) {
    const token = getAuthToken();

    const headers = {
        ...(options.headers || {}),
        Authorization: `Bearer ${token}`
    };

    const response = await fetch(url, {
        ...options,
        headers
    });

    if (response.status === 401) {
        localStorage.removeItem("posToken");
        localStorage.removeItem("posUser");

        window.location.replace("login.html");

        throw new Error(
            "Your session has expired. Please log in again."
        );
    }

    return response;
}

async function readResponse(response) {
    const text = await response.text();

    if (!text) {
        return {};
    }

    try {
        return JSON.parse(text);
    } catch {
        throw new Error("The server returned an invalid response.");
    }
}

// =========================================
// GENERAL HELPERS
// =========================================

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatCurrency(amount) {
    const number = Number(amount);

    return "₦" + (Number.isFinite(number) ? number : 0)
        .toLocaleString("en-NG", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
}

function getReceiptCustomer(receipt) {
    if (typeof receipt.customer === "string") {
        return receipt.customer;
    }

    return receipt.customerName ||
        receipt.customer?.name ||
        receipt.Customer?.name ||
        "Walk-in Customer";
}

function getReceiptStatus(receipt) {
    return String(
        receipt.paymentStatus ||
        receipt.status ||
        "UNKNOWN"
    ).trim().toUpperCase();
}
function getSentReceiptStorageKey() {
    let businessId = "default";

    try {
        const user = JSON.parse(
            localStorage.getItem("posUser") || "{}"
        );

        if (user.businessId) {
            businessId = user.businessId;
        }
    } catch (error) {
        console.error("Could not read POS user:", error);
    }

    return `posSentReceiptQueue_${businessId}`;
}

function getSentReceiptNumbers() {
    try {
        const sentReceipts = JSON.parse(
            localStorage.getItem(getSentReceiptStorageKey()) || "[]"
        );

        if (!Array.isArray(sentReceipts)) {
            return new Set();
        }

        return new Set(
            sentReceipts
                .map(item =>
                    typeof item === "string"
                        ? item
                        : item.saleNumber
                )
                .filter(Boolean)
                .map(number => String(number).trim().toUpperCase())
        );

    } catch (error) {
        console.error("Could not read sent receipts:", error);
        return new Set();
    }
}
function getStatusClass(status) {
    switch (status) {
        case "PAID":
            return "paid";

        case "PARTIALLY_PAID":
        case "PARTIAL":
            return "partial";

        case "PENDING":
        case "UNPAID":
            return "pending";

        default:
            return "unknown";
    }
}

// =========================================
// RENDER RECEIPT QUEUE
// =========================================

function renderReceiptQueue() {
    const table = document.getElementById("queueTable");
    const searchInput = document.getElementById("receiptSearch");
    const clearButton = document.getElementById("clearSearch");
    const searchInfo = document.getElementById("searchInfo");

    const term = searchInput.value.trim().toLowerCase();

    clearButton.classList.toggle("visible", term.length > 0);

    const filteredReceipts = receiptQueueCache.filter(receipt => {
        const customer = getReceiptCustomer(receipt);
        const saleNumber = receipt.saleNumber || "";
        const status = getReceiptStatus(receipt);

        const searchableText = [
            customer,
            saleNumber,
            status,
            status.replace(/_/g, " "),
            receipt.customerPhone || "",
            receipt.phone || "",
            receipt.customer?.phone || "",
            receipt.Customer?.phone || ""
        ].join(" ").toLowerCase();

        return searchableText.includes(term);
    });

    searchInfo.textContent = term
        ? `Showing ${filteredReceipts.length} of ${receiptQueueCache.length} receipts`
        : `Showing all ${receiptQueueCache.length} receipts`;

    if (filteredReceipts.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    ${term
                        ? "No matching receipts found. Try another search."
                        : "No receipts available."}
                </td>
            </tr>
        `;

        return;
    }

    table.innerHTML = "";

    filteredReceipts.forEach(receipt => {
        const row = document.createElement("tr");

        const customerName = getReceiptCustomer(receipt);
        const saleNumber = String(receipt.saleNumber || "");
        const status = getReceiptStatus(receipt);
        const statusClass = getStatusClass(status);

        row.innerHTML = `
            <td>
                <div class="customer-name">
                    ${escapeHtml(customerName)}
                </div>
            </td>

            <td>
                <span class="sale-number">
                    ${escapeHtml(saleNumber || "—")}
                </span>
            </td>

            <td>${formatCurrency(receipt.totalAmount)}</td>

            <td>${formatCurrency(receipt.totalPaid)}</td>

            <td>${formatCurrency(receipt.balance)}</td>

            <td>
                <span class="status ${statusClass}">
                    ${escapeHtml(status.replace(/_/g, " "))}
                </span>
            </td>

            <td>
                <button type="button" class="open-button">
                    Open Receipt →
                </button>
            </td>
        `;

        row.querySelector(".open-button").addEventListener(
            "click",
            () => openReceipt(saleNumber)
        );

        table.appendChild(row);
    });
}

// =========================================
// LOAD RECEIPT QUEUE WITH JWT
// =========================================

async function loadReceiptQueue() {
    const table = document.getElementById("queueTable");
    const message = document.getElementById("message");

    const receiptCount = document.getElementById("receiptCount");
    const paidCount = document.getElementById("paidCount");
    const totalAmount = document.getElementById("totalAmount");
    const refreshButton = document.getElementById("refreshQueueButton");

    table.innerHTML = `
        <tr>
            <td colspan="7" class="empty">
                Loading receipt queue...
            </td>
        </tr>
    `;

    message.textContent = "";

    refreshButton.disabled = true;
    refreshButton.textContent = "Loading...";

    try {
        const response = await apiFetch(RECEIPT_QUEUE_URL, {
            headers: {
                Accept: "application/json"
            }
        });

        const data = await readResponse(response);

        if (!response.ok) {
            throw new Error(
                data.message || "Failed to load receipt queue."
            );
        }

        const receipts = Array.isArray(data)
            ? data
            : Array.isArray(data.receipts)
                ? data.receipts
                : Array.isArray(data.data)
                    ? data.data
                    : [];

        const sentReceiptNumbers = getSentReceiptNumbers();
        receiptQueueCache = receipts.filter(receipt => {
            const saleNumber = String(receipt.saleNumber || "")
                  .trim()
                  .toUpperCase();

            return !sentReceiptNumbers.has(saleNumber);
            });

        let fullyPaid = 0;
        let amountTotal = 0;

        receiptQueueCache.forEach(receipt => {
            amountTotal += Number(receipt.totalAmount || 0);

            if (getReceiptStatus(receipt) === "PAID") {
                fullyPaid++;}
            });

        receiptCount.textContent = receiptQueueCache.length;
        paidCount.textContent = fullyPaid;
        totalAmount.textContent = formatCurrency(amountTotal);

renderReceiptQueue();



        receiptCount.textContent = receipts.length;
        paidCount.textContent = fullyPaid;
        totalAmount.textContent = formatCurrency(amountTotal);

        renderReceiptQueue();

    } catch (error) {
        console.error("Receipt queue error:", error);

        receiptQueueCache = [];

        receiptCount.textContent = "—";
        paidCount.textContent = "—";
        totalAmount.textContent = "—";

        document.getElementById("searchInfo").textContent =
            "Unable to search receipts";

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    Failed to load receipt queue.
                    Check the backend and try refreshing.
                </td>
            </tr>
        `;

        message.textContent = error.message ||
            "An error occurred while loading receipts.";

    } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = "Refresh Queue";
    }
}

// =========================================
// OPEN RECEIPT
// =========================================

function openReceipt(saleNumber) {
    if (!saleNumber) {
        alert("This sale has no sale number.");
        return;
    }

    window.location.href =
        "receipt.html?sale=" + encodeURIComponent(saleNumber);
}

// =========================================
// SEARCH AND BUTTON EVENTS
// =========================================

document.getElementById("receiptSearch").addEventListener(
    "input",
    renderReceiptQueue
);

document.getElementById("clearSearch").addEventListener(
    "click",
    () => {
        document.getElementById("receiptSearch").value = "";

        renderReceiptQueue();

        document.getElementById("receiptSearch").focus();
    }
);

document.getElementById("refreshQueueButton").addEventListener(
    "click",
    loadReceiptQueue
);

// =========================================
// INITIALIZE PAGE
// =========================================

document.addEventListener("DOMContentLoaded", () => {
    if (typeof initPOSLayout === "function") {
        initPOSLayout("Receipt Queue");
    }

    loadReceiptQueue();
});
</script>

</body>
</html>
