
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern POS - Categories</title>

    <link rel="stylesheet" href="css/pos.css">

    <style>
        .category-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .category-form {
            display: none;
            margin-bottom: 24px;
        }

        .category-form.is-visible {
            display: block;
        }

        .category-form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .category-message {
            display: none;
            padding: 12px 14px;
            margin-top: 16px;
            border-radius: 8px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .category-message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .category-message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .category-message a {
            color: inherit;
            font-weight: 700;
        }

        .category-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-edit-button {
            background: #e5e7eb;
            color: #111827;
        }

        .category-edit-button:hover {
            background: #d1d5db;
        }

        .category-table-name {
            font-weight: 600;
            color: #111827;
        }

        .category-loading {
            text-align: center;
            padding: 24px;
        }

        .category-count-card {
            margin-bottom: 24px;
        }

        .category-count-card .pos-stat-value {
            font-variant-numeric: tabular-nums;
        }

        .category-form .pos-input {
            width: 100%;
            box-sizing: border-box;
        }

        @media (max-width: 600px) {
            .category-toolbar {
                align-items: stretch;
            }

            .category-toolbar .pos-btn {
                width: 100%;
            }

            .category-form-actions {
                flex-direction: column;
            }

            .category-form-actions .pos-btn {
                width: 100%;
            }

            .category-actions {
                flex-direction: column;
            }

            .category-actions .pos-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="pos-app">

    <aside id="posSidebar" class="pos-sidebar"></aside>

    <main class="pos-main">

        <header id="posTopbar" class="pos-topbar"></header>

        <div class="pos-content">

            <!-- PAGE HEADER -->

            <div class="pos-page-header category-toolbar">
                <div>
                    <h1 class="pos-page-title">Categories</h1>
                    <p class="pos-page-description">
                        Manage product categories in your store.
                    </p>
                </div>

                <button
                    type="button"
                    class="pos-btn pos-btn-primary"
                    id="addCategoryButton"
                >
                    + Add Category
                </button>
            </div>

            <!-- GENERAL MESSAGE -->

            <div
                id="pageMessage"
                class="category-message"
                role="alert"
                aria-live="polite"
            ></div>

            <!-- STATISTICS -->

            <div class="pos-stat-grid category-count-card">

                <div class="pos-stat-card">
                    <div class="pos-stat-label">
                        Total Categories
                    </div>

                    <div class="pos-stat-value" id="totalCategories">
                        0
                    </div>
                </div>

            </div>

            <!-- CATEGORY FORM -->

            <section
                class="pos-card category-form"
                id="categoryForm"
            >

                <h2 class="pos-card-title" id="formTitle">
                    Add Category
                </h2>

                <form id="categoryFormElement">

                    <div class="pos-form-grid">

                        <div class="pos-form-group">

                            <label
                                class="pos-form-label"
                                for="categoryName"
                            >
                                Category Name
                            </label>

                            <input
                                type="text"
                                id="categoryName"
                                class="pos-input"
                                placeholder="Enter category name"
                                maxlength="100"
                                autocomplete="off"
                                required
                            >

                        </div>

                    </div>

                    <div class="category-form-actions">

                        <button
                            type="submit"
                            class="pos-btn pos-btn-success"
                            id="saveCategoryButton"
                        >
                            Save Category
                        </button>

                        <button
                            type="button"
                            class="pos-btn"
                            id="cancelCategoryButton"
                            style="background:#e5e7eb;color:#111827;"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

                <div
                    id="categoryMessage"
                    class="category-message"
                    role="alert"
                    aria-live="polite"
                ></div>

            </section>

            <!-- CATEGORY TABLE -->

            <section class="pos-card">

                <h2 class="pos-card-title">
                    Category List
                </h2>

                <div class="pos-table-wrapper">

                    <table class="pos-table">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Category Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="categoryTableBody">

                            <tr>
                                <td colspan="3" class="category-loading">
                                    Loading categories...
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </div>

    </main>

</div>

<script src="js/pos-layout.js" defer></script>

<script>
"use strict";

/* ==================================================
   CONFIGURATION
================================================== */

const CATEGORIES_API =
    "http://127.0.0.1:3000/api/categories";

let allCategories = [];
let editingCategoryId = null;
let isSavingCategory = false;

/* ==================================================
   AUTHENTICATION
================================================== */

/*
   The login page must save the JWT token under:
   localStorage.setItem("posToken", token);
*/

function getToken() {
    return localStorage.getItem("posToken");
}

function redirectToLogin() {
    const returnTo =
        window.location.pathname + window.location.search;

    window.location.href =
        "login.html?returnTo=" + encodeURIComponent(returnTo);
}

function showPageMessage(message, type = "error", showLoginLink = false) {
    const box = document.getElementById("pageMessage");

    box.replaceChildren();
    box.className = "category-message " + type;

    box.appendChild(
        document.createTextNode(String(message))
    );

    if (showLoginLink) {
        box.appendChild(document.createTextNode(" "));

        const link = document.createElement("a");
        link.href = "login.html";
        link.textContent = "Go to login";

        box.appendChild(link);
    }
}

function hidePageMessage() {
    const box = document.getElementById("pageMessage");

    box.replaceChildren();
    box.className = "category-message";
}

function showCategoryMessage(message, type = "success") {
    const box = document.getElementById("categoryMessage");

    box.textContent = String(message);
    box.className = "category-message " + type;
}

function hideCategoryMessage() {
    const box = document.getElementById("categoryMessage");

    box.textContent = "";
    box.className = "category-message";
}

/*
   All category API requests pass through this function.
   It automatically attaches the JWT Authorization header.
*/

async function categoryFetch(path = "", options = {}) {
    const token = getToken();

    if (!token) {
        redirectToLogin();
        throw new Error("Please log in to manage categories.");
    }

    const headers = new Headers(options.headers || {});

    headers.set("Authorization", "Bearer " + token);

    const response = await fetch(
        CATEGORIES_API + path,
        {
            ...options,
            headers
        }
    );

    if (response.status === 401) {
        showPageMessage(
            "Your session is invalid or expired. Please log in again.",
            "error",
            true
        );

        throw new Error("Authentication required. Please log in.");
    }

    if (response.status === 403) {
        throw new Error(
            "You do not have permission to perform this action."
        );
    }

    return response;
}

async function readResponse(response) {
    const contentType =
        response.headers.get("content-type") || "";

    if (contentType.includes("application/json")) {
        return response.json();
    }

    const text = await response.text();

    return {
        message: text || "Unexpected server response."
    };
}

/* ==================================================
   SHOW AND CLOSE FORM
================================================== */

function showCategoryForm(category = null) {
    hidePageMessage();
    hideCategoryMessage();

    editingCategoryId = category ? category.id : null;

    document.getElementById("formTitle").textContent =
        category ? "Edit Category" : "Add Category";

    document.getElementById("saveCategoryButton").textContent =
        category ? "Update Category" : "Save Category";

    document.getElementById("categoryName").value =
        category ? category.name : "";

    document.getElementById("categoryForm").classList.add("is-visible");

    document.getElementById("categoryName").focus();
}

function closeCategoryForm() {
    editingCategoryId = null;

    document.getElementById("categoryForm").classList.remove("is-visible");
    document.getElementById("categoryName").value = "";

    document.getElementById("saveCategoryButton").textContent =
        "Save Category";

    document.getElementById("saveCategoryButton").disabled = false;

    hideCategoryMessage();
}

/* ==================================================
   LOAD CATEGORIES
================================================== */

async function loadCategories() {
    const tableBody =
        document.getElementById("categoryTableBody");

    tableBody.replaceChildren();

    const row = document.createElement("tr");
    const cell = document.createElement("td");

    cell.colSpan = 3;
    cell.className = "category-loading";
    cell.textContent = "Loading categories...";

    row.appendChild(cell);
    tableBody.appendChild(row);

    hidePageMessage();

    try {
        const response = await categoryFetch();

        const data = await readResponse(response);

        if (!response.ok) {
            throw new Error(
                data.message || "Failed to load categories."
            );
        }

        if (Array.isArray(data)) {
            allCategories = data;
        } else if (Array.isArray(data.categories)) {
            allCategories = data.categories;
        } else {
            allCategories = [];
        }

        displayCategories(allCategories);

    } catch (error) {
        console.error("Load categories error:", error);

        tableBody.replaceChildren();

        const errorRow = document.createElement("tr");
        const errorCell = document.createElement("td");

        errorCell.colSpan = 3;
        errorCell.className = "category-loading";
        errorCell.textContent =
            "Failed to load categories. Check your login and server.";

        errorRow.appendChild(errorCell);
        tableBody.appendChild(errorRow);

        if (getToken() && !document.getElementById("pageMessage").textContent) {
            showPageMessage(
                error.message || "Failed to load categories."
            );
        }
    }
}

/* ==================================================
   DISPLAY CATEGORIES
================================================== */

function displayCategories(categories) {
    const tableBody =
        document.getElementById("categoryTableBody");

    tableBody.replaceChildren();

    document.getElementById("totalCategories").textContent =
        String(categories.length);

    if (categories.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 3;
        cell.className = "category-loading";
        cell.textContent = "No categories found.";

        row.appendChild(cell);
        tableBody.appendChild(row);

        return;
    }

    for (const category of categories) {
        const row = document.createElement("tr");

        const idCell = document.createElement("td");
        idCell.textContent = String(category.id ?? "-");

        const nameCell = document.createElement("td");
        nameCell.className = "category-table-name";
        nameCell.textContent = String(category.name ?? "-");

        const actionsCell = document.createElement("td");
        const actions = document.createElement("div");

        actions.className = "category-actions";

        const editButton = document.createElement("button");

        editButton.type = "button";
        editButton.className =
            "pos-btn category-edit-button";

        editButton.textContent = "Edit";
        editButton.dataset.action = "edit";
        editButton.dataset.id = String(category.id);

        const deleteButton = document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className = "pos-btn pos-btn-danger";

        deleteButton.textContent = "Delete";
        deleteButton.dataset.action = "delete";
        deleteButton.dataset.id = String(category.id);

        actions.append(editButton, deleteButton);
        actionsCell.appendChild(actions);

        row.append(idCell, nameCell, actionsCell);
        tableBody.appendChild(row);
    }
}

/* ==================================================
   SAVE OR UPDATE CATEGORY
================================================== */

async function saveCategory(event) {
    event.preventDefault();

    if (isSavingCategory) return;

    const nameInput =
        document.getElementById("categoryName");

    const name = nameInput.value.trim();

    if (!name) {
        showCategoryMessage(
            "Please enter a category name.",
            "error"
        );

        nameInput.focus();
        return;
    }

    if (name.length > 100) {
        showCategoryMessage(
            "Category name cannot exceed 100 characters.",
            "error"
        );

        nameInput.focus();
        return;
    }

    isSavingCategory = true;

    const saveButton =
        document.getElementById("saveCategoryButton");

    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    hideCategoryMessage();

    const wasEditing = editingCategoryId !== null;

    try {
        const path = wasEditing
            ? "/" + encodeURIComponent(String(editingCategoryId))
            : "";

        const response = await categoryFetch(path, {
            method: wasEditing ? "PUT" : "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({ name })
        });

        const data = await readResponse(response);

        if (!response.ok) {
            throw new Error(
                data.message || "Failed to save category."
            );
        }

        showCategoryMessage(
            data.message ||
                (
                    wasEditing
                        ? "Category updated successfully."
                        : "Category created successfully."
                ),
            "success"
        );

        await loadCategories();

        /*
           Close the form only if the save request succeeded.
        */
        closeCategoryForm();

        showPageMessage(
            data.message ||
                (
                    wasEditing
                        ? "Category updated successfully."
                        : "Category created successfully."
                ),
            "success"
        );

    } catch (error) {
        console.error("Save category error:", error);

        showCategoryMessage(
            error.message || "Failed to save category.",
            "error"
        );

    } finally {
        isSavingCategory = false;

        saveButton.disabled = false;

        saveButton.textContent =
            editingCategoryId !== null
                ? "Update Category"
                : "Save Category";
    }
}

/* ==================================================
   EDIT CATEGORY
================================================== */

function editCategory(id) {
    const category = allCategories.find(
        item => String(item.id) === String(id)
    );

    if (!category) {
        showPageMessage("Category not found.");
        return;
    }

    showCategoryForm(category);
}

/* ==================================================
   DELETE CATEGORY
================================================== */

async function deleteCategory(id) {
    const category = allCategories.find(
        item => String(item.id) === String(id)
    );

    if (!category) {
        showPageMessage("Category not found.");
        return;
    }

    const confirmed = confirm(
        'Are you sure you want to delete "' +
        category.name +
        '"?'
    );

    if (!confirmed) return;

    hidePageMessage();

    try {
        const response = await categoryFetch(
            "/" + encodeURIComponent(String(id)),
            {
                method: "DELETE"
            }
        );

        const data = await readResponse(response);

        if (!response.ok) {
            throw new Error(
                data.message || "Failed to delete category."
            );
        }

        showPageMessage(
            data.message || "Category deleted successfully.",
            "success"
        );

        await loadCategories();

    } catch (error) {
        console.error("Delete category error:", error);

        showPageMessage(
            error.message || "Failed to delete category."
        );
    }
}

/* ==================================================
   EVENT LISTENERS
================================================== */

document.getElementById("addCategoryButton")
    .addEventListener("click", () => {
        showCategoryForm();
    });

document.getElementById("cancelCategoryButton")
    .addEventListener("click", closeCategoryForm);

document.getElementById("categoryFormElement")
    .addEventListener("submit", saveCategory);

document.getElementById("categoryTableBody")
    .addEventListener("click", event => {
        const button = event.target.closest("button[data-action]");

        if (!button) return;

        const id = button.dataset.id;

        if (button.dataset.action === "edit") {
            editCategory(id);
        }

        if (button.dataset.action === "delete") {
            deleteCategory(id);
        }
    });

/* ==================================================
   INITIALIZE PAGE
================================================== */

document.addEventListener("DOMContentLoaded", () => {
    if (!getToken()) {
        showPageMessage(
            "Please log in to manage product categories.",
            "error",
            true
        );

        redirectToLogin();
        return;
    }

    loadCategories();
});
</script>

</body>
</html>
