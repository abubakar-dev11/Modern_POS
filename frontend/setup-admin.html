<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern POS | Admin Setup</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,.08);
        }

        h1 { margin: 0 0 8px; font-size: 25px; }
        .subtitle { color: #64748b; margin-bottom: 25px; }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled { opacity: .6; cursor: wait; }

        #message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            overflow-wrap: anywhere;
        }

        .error { display: block !important; background: #fee2e2; color: #991b1b; }
        .success { display: block !important; background: #dcfce7; color: #166534; }

        .note {
            margin-top: 18px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        a { color: #2563eb; }
    </style>
</head>

<body>
    <main class="card">
        <h1>Create First Admin</h1>
        <p class="subtitle">Set up the main administrator for Modern POS.</p>

        <form id="setupForm">
            <label for="setupKey">Admin Setup Key</label>
            <input
                id="setupKey"
                type="password"
                autocomplete="off"
                required
                placeholder="Enter your setup key"
            >

            <label for="businessId">Business ID</label>
            <input id="businessId" type="number" min="1" value="1" required>

            <label for="branchId">Branch ID (optional)</label>
            <input id="branchId" type="number" min="1" value="1">

            <label for="name">Admin Full Name</label>
            <input id="name" type="text" maxlength="100" required>

            <label for="email">Email Address</label>
            <input id="email" type="email" required autocomplete="email">

            <label for="password">Password (at least 12 characters)</label>
            <input
                id="password"
                type="password"
                minlength="12"
                required
                autocomplete="new-password"
            >

            <button id="submitButton" type="submit">Create Admin</button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <p class="note">
            This page is for first-time setup only. Keep your setup key private.
            After creating the admin, continue to the
            <a href="login.html">login page</a>.
        </p>
    </main>

    <script>
        const API_BASE = ((window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://localhost:3000/api/auth" : "https://modern-pos-tau.vercel.app/api/auth");

        const form = document.getElementById("setupForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = type;
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const setupKey = document.getElementById("setupKey").value;
            const businessId = Number(
                document.getElementById("businessId").value
            );
            const branchValue = document.getElementById("branchId").value;
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!Number.isInteger(businessId) || businessId < 1) {
                showMessage("Enter a valid Business ID.", "error");
                return;
            }

            const data = {
                businessId,
                name,
                email,
                password
            };

            if (branchValue.trim() !== "") {
                const branchId = Number(branchValue);

                if (!Number.isInteger(branchId) || branchId < 1) {
                    showMessage("Enter a valid Branch ID or leave it empty.", "error");
                    return;
                }

                data.branchId = branchId;
            }

            button.disabled = true;
            button.textContent = "Creating admin...";
            message.className = "";

            try {
                const response = await fetch(`${API_BASE}/setup-admin`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-setup-key": setupKey
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Admin setup failed.");
                }

                showMessage(
                    "Admin created successfully. Opening login page...",
                    "success"
                );

                form.reset();

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {
                showMessage(
                    error.message || "Could not connect to the backend.",
                    "error"
                );
            } finally {
                button.disabled = false;
                button.textContent = "Create Admin";
            }
        });
    </script>
</body>
</html>
