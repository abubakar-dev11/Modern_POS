
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern POS - Products</title>
    <link rel="stylesheet" href="css/pos.css">
</head>
<body>
    <div class="pos-app">
        <aside id="posSidebar" class="pos-sidebar"></aside>
        <main class="pos-main">
            <header id="posTopbar" class="pos-topbar"></header>
            <div class="pos-content">
                <div class="pos-page-header">
                    <div>
                        <h1 class="pos-page-title">Products</h1>
                        <p class="pos-page-description">
                            Manage products, prices, stock and product information.
                        </p>
                    </div>

                    <button
                        class="pos-btn pos-btn-success"
                        id="addProductButton"
                        type="button"
                        onclick="showAddProductForm()"
                    >
                        + Add Product
                    </button>
                </div>

                <div class="pos-card">
                    <h2 class="pos-card-title">Product Search</h2>

                    <div class="pos-form-grid">
                        <div class="pos-form-group">
                            <label
                                class="pos-form-label"
                                for="searchProduct"
                            >
                                Search Product
                            </label>

                            <input
                                type="text"
                                id="searchProduct"
                                class="pos-input"
                                placeholder="Search product or SKU..."
                                oninput="filterProducts()"
                            >
                        </div>
                    </div>
                </div>

                <div
                    id="productForm"
                    class="pos-card"
                    style="display:none;"
                >
                    <h2 id="productFormTitle" class="pos-card-title">
                        Add New Product
                    </h2>

                    <input type="hidden" id="editingProductId">

                    <div class="pos-form-grid">
                        <div class="pos-form-group">
                            <label
                                class="pos-form-label"
                                for="productName"
                            >
                                Product Name
                            </label>

                            <input
                                type="text"
                                id="productName"
                                class="pos-input"
                                placeholder="Enter product name"
                            >
                        </div>

                        <div class="pos-form-group">
                            <label
                                class="pos-form-label"
                                for="productSku"
                            >
                                SKU
                            </label>

                            <input
                                type="text"
                                id="productSku"
                                class="pos-input"
                                placeholder="Enter SKU"
                            >
                        </div>

                        <div class="pos-form-group">
                            <label
                                class="pos-form-label"
                                for="productCategory"
                            >
                                Category
                            </label>

                            <select
                                id="productCategory"
                                class="pos-select"
                                required
                            >
                                <option value="">Select category</option>
                            </select>

                            <div
                                id="categoryMessage"
                                class="pos-message"
                                role="status"
                                aria-live="polite"
                            ></div>
                        </div>

                        <div class="pos-form-group">
                            <label
                                class="pos-form-label"
                                for="buyingPrice"
                            >
                                Buying Price
                            </label>

                            <input
                                type="number"
                                id="buyingPrice"
                                class="pos-input"
                                min="0"
                                step="0.01"
                                placeholder="Enter buying price"
                            >
                        </div>

                        <div class="pos-form-group">
                            <label
                                class="pos-form-label"
                                for="sellingPrice"
                            >
                                Selling Price
                            </label>

                            <input
                                type="number"
                                id="sellingPrice"
                                class="pos-input"
                                min="0"
                                step="0.01"
                                placeholder="Enter selling price"
                            >
                        </div>

                        <div class="pos-form-group">
                            <label
                                class="pos-form-label"
                                for="openingStock"
                            >
                                Opening Stock
                            </label>

                            <input
                                type="number"
                                id="openingStock"
                                class="pos-input"
                                min="0"
                                step="1"
                                placeholder="Enter opening stock"
                            >
                        </div>

                        <div class="pos-form-group">
                            <label
                                class="pos-form-label"
                                for="productImage"
                            >
                                Product Image
                            </label>

                            <input
                                type="file"
                                id="productImage"
                                class="pos-input"
                                accept="image/*"
                                onchange="previewProductImage()"
                            >

                            <div
                                id="imagePreviewContainer"
                                style="margin-top:12px;"
                            >
                                <img
                                    id="imagePreview"
                                    src=""
                                    alt="Product Preview"
                                    style="display:none;width:120px;height:120px;object-fit:cover;border-radius:8px;border:1px solid #e5e7eb;"
                                >
                            </div>
                        </div>
                    </div>

                    <div style="display:flex;gap:10px;margin-top:10px;">
                        <button
                            class="pos-btn pos-btn-success"
                            id="saveProductButton"
                            type="button"
                            onclick="saveProduct()"
                        >
                            Save Product
                        </button>

                        <button
                            class="pos-btn pos-btn-primary"
                            type="button"
                            onclick="closeProductForm()"
                        >
                            Cancel
                        </button>
                    </div>
                </div>

                <div class="pos-card">
                    <h2 class="pos-card-title">Product List</h2>

                    <div class="pos-table-wrapper">
                        <table class="pos-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>SKU</th>
                                    <th>Category</th>
                                    <th>Selling Price</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>

                            <tbody id="productsTableBody">
                                <tr>
                                    <td
                                        colspan="7"
                                        class="pos-loading"
                                    >
                                        Loading products...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div
                    id="productMessage"
                    class="pos-message"
                    role="status"
                    aria-live="polite"
                ></div>
            </div>
        </main>
    </div>

    <script src="js/pos-layout.js"></script>

    <script>
        "use strict";

        const PRODUCTS_API =
            `${(window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://127.0.0.1:3000/api" : "https://modern-pos-tau.vercel.app/api"}/products`;

        const CATEGORIES_API =
            `${(window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://127.0.0.1:3000/api" : "https://modern-pos-tau.vercel.app/api"}/categories`;

        let allProducts = [];

        // =========================================
        // GET AUTHENTICATION HEADERS
        // =========================================
        function getAuthHeaders() {
            const token = localStorage.getItem("posToken");

            if (!token) {
                alert(
                    "Your session is missing. Please log in again."
                );

                window.location.href = "login.html";
                return null;
            }

            return {
                Authorization: `Bearer ${token}`
            };
        }


        // =========================================
        // API REQUEST — SEND JWT TOKEN
        // =========================================
        async function apiRequest(url, options = {}) {
            const headers = getAuthHeaders();

            if (!headers) {
                throw new Error("LOGIN_REQUIRED");
            }

            const response = await fetch(url, {
                ...options,
                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            });

            if (response.status === 401) {
                localStorage.removeItem("posToken");
                localStorage.removeItem("posUser");

                alert(
                    "Your session has expired. Please log in again."
                );

                window.location.href = "login.html";

                throw new Error("LOGIN_REQUIRED");
            }

            return response;
        }


        // =========================================
        // READ API RESPONSE
        // =========================================
        async function readApiResponse(response) {
            const contentType =
                response.headers.get("content-type") || "";

            if (contentType.includes("application/json")) {
                return response.json();
            }

            return {
                message: await response.text()
            };
        }


        // =========================================
        // GET USER ROLE
        // =========================================
        function getCurrentRole() {
            try {
                const storedUser = JSON.parse(
                    localStorage.getItem("posUser") || "{}"
                );

                const user = storedUser.user || storedUser;

                return String(
                    user.role || user.userRole || ""
                ).trim().toUpperCase();
            } catch (error) {
                console.error("Could not read user role.");
                return "";
            }
        }


        // =========================================
        // FRONTEND BUTTON PERMISSIONS
        // =========================================
        function configureProductPermissions() {
            const role = getCurrentRole();

            const addButton =
                document.getElementById("addProductButton");

            if (addButton) {
                addButton.hidden = ![
                    "ADMIN",
                    "MANAGER"
                ].includes(role);
            }
        }


        // =========================================
        // SHOW ADD PRODUCT FORM
        // =========================================
        async function showAddProductForm() {
            const role = getCurrentRole();

            if (!["ADMIN", "MANAGER"].includes(role)) {
                alert(
                    "You do not have permission to create products."
                );
                return;
            }

            const form =
                document.getElementById("productForm");

            form.style.display = "block";

            document.getElementById(
                "productFormTitle"
            ).textContent = "Add New Product";

            document.getElementById(
                "editingProductId"
            ).value = "";

            document.getElementById(
                "productName"
            ).value = "";

            document.getElementById(
                "productSku"
            ).value = "";

            document.getElementById(
                "productCategory"
            ).value = "";

            document.getElementById(
                "buyingPrice"
            ).value = "";

            document.getElementById(
                "sellingPrice"
            ).value = "";

            document.getElementById(
                "openingStock"
            ).value = "";

            document.getElementById(
                "productImage"
            ).value = "";

            const preview =
                document.getElementById("imagePreview");

            if (preview.dataset.objectUrl) {
                URL.revokeObjectURL(
                    preview.dataset.objectUrl
                );

                delete preview.dataset.objectUrl;
            }

            preview.style.display = "none";
            preview.src = "";

            // Reload categories when opening the form.
            await loadCategories();

            document.getElementById(
                "productName"
            ).focus();
        }


        // =========================================
        // CLOSE PRODUCT FORM
        // =========================================
        function closeProductForm() {
            document.getElementById(
                "productForm"
            ).style.display = "none";
        }


        // =========================================
        // LOAD CATEGORIES — JWT PROTECTED
        // =========================================
        async function loadCategories() {
            const categorySelect =
                document.getElementById("productCategory");

            if (!categorySelect) {
                return;
            }

            categorySelect.replaceChildren();

            const loadingOption =
                document.createElement("option");

            loadingOption.value = "";
            loadingOption.textContent =
                "Loading categories...";

            loadingOption.disabled = true;
            loadingOption.selected = true;

            categorySelect.appendChild(loadingOption);

            try {
                /*
                 * Important:
                 * The Categories API requires authentication.
                 * apiRequest() adds the Bearer token.
                 */
                const response = await apiRequest(
                    CATEGORIES_API,
                    {
                        headers: {
                            Accept: "application/json"
                        }
                    }
                );

                const result =
                    await readApiResponse(response);

                if (!response.ok) {
                    throw new Error(
                        result.message ||
                        `Failed to load categories (HTTP ${response.status}).`
                    );
                }

                const categories = Array.isArray(result)
                    ? result
                    : Array.isArray(result.categories)
                        ? result.categories
                        : Array.isArray(result.data)
                            ? result.data
                            : [];

                categorySelect.replaceChildren();

                const placeholder =
                    document.createElement("option");

                placeholder.value = "";
                placeholder.textContent = categories.length
                    ? "Select category"
                    : "No categories found";

                placeholder.selected = true;

                categorySelect.appendChild(placeholder);

                categories.forEach(category => {
                    const option =
                        document.createElement("option");

                    option.value = String(category.id);

                    option.textContent =
                        category.name ||
                        `Category ${category.id}`;

                    categorySelect.appendChild(option);
                });

                if (categories.length === 0) {
                    console.warn(
                        "No categories were returned for this business."
                    );
                }

                document.getElementById(
                    "categoryMessage"
                ).textContent = "";
            } catch (error) {
                if (error.message === "LOGIN_REQUIRED") {
                    return;
                }

                console.error(
                    "Category loading error:",
                    error
                );

                categorySelect.replaceChildren();

                const errorOption =
                    document.createElement("option");

                errorOption.value = "";

                errorOption.textContent =
                    "Unable to load categories — refresh page";

                errorOption.disabled = true;
                errorOption.selected = true;

                categorySelect.appendChild(errorOption);

                document.getElementById(
                    "categoryMessage"
                ).textContent = error.message ||
                    "Failed to load categories.";
            }
        }


        // =========================================
        // SAVE PRODUCT
        // =========================================
        async function saveProduct() {
            const role = getCurrentRole();

            if (!["ADMIN", "MANAGER"].includes(role)) {
                alert(
                    "You do not have permission to create or update products."
                );
                return;
            }

            const saveButton =
                document.getElementById("saveProductButton");

            saveButton.disabled = true;

            try {
                const editingProductId =
                    document.getElementById(
                        "editingProductId"
                    ).value;

                const name =
                    document.getElementById(
                        "productName"
                    ).value.trim();

                const sku =
                    document.getElementById(
                        "productSku"
                    ).value.trim();

                const categoryId =
                    document.getElementById(
                        "productCategory"
                    ).value;

                const costPrice =
                    document.getElementById(
                        "buyingPrice"
                    ).value;

                const sellingPrice =
                    document.getElementById(
                        "sellingPrice"
                    ).value;

                const stockQuantity =
                    document.getElementById(
                        "openingStock"
                    ).value;

                const imageInput =
                    document.getElementById(
                        "productImage"
                    );

                const imageFile = imageInput.files[0];

                if (!name) {
                    alert("Product name is required.");
                    return;
                }

                if (!sku) {
                    alert("SKU is required.");
                    return;
                }

                if (!categoryId) {
                    alert("Category is required.");
                    return;
                }

                if (
                    costPrice === "" ||
                    !Number.isFinite(Number(costPrice)) ||
                    Number(costPrice) < 0
                ) {
                    alert("Enter a valid buying price.");
                    return;
                }

                if (
                    sellingPrice === "" ||
                    !Number.isFinite(Number(sellingPrice)) ||
                    Number(sellingPrice) < 0
                ) {
                    alert("Enter a valid selling price.");
                    return;
                }

                if (
                    stockQuantity !== "" &&
                    (
                        !Number.isInteger(Number(stockQuantity)) ||
                        Number(stockQuantity) < 0
                    )
                ) {
                    alert(
                        "Opening stock must be a non-negative whole number."
                    );
                    return;
                }

                const formData = new FormData();

                formData.append("name", name);
                formData.append("sku", sku);
                formData.append("barcode", "");
                formData.append(
                    "categoryId",
                    Number(categoryId)
                );
                formData.append(
                    "costPrice",
                    Number(costPrice)
                );
                formData.append(
                    "sellingPrice",
                    Number(sellingPrice)
                );
                formData.append(
                    "stockQuantity",
                    Number(stockQuantity || 0)
                );

                if (imageFile) {
                    formData.append(
                        "productImage",
                        imageFile
                    );
                }

                let url = PRODUCTS_API;
                let method = "POST";

                if (editingProductId) {
                    url =
                        `${PRODUCTS_API}/${encodeURIComponent(editingProductId)}`;

                    method = "PUT";
                }

                // Do not manually set Content-Type for FormData.
                const response = await apiRequest(url, {
                    method,
                    body: formData
                });

                const data =
                    await readApiResponse(response);

                if (!response.ok) {
                    alert(
                        data.message ||
                        "Failed to save product."
                    );
                    return;
                }

                alert(
                    editingProductId
                        ? "Product updated successfully."
                        : "Product created successfully."
                );

                closeProductForm();

                await loadProducts();
            } catch (error) {
                if (error.message === "LOGIN_REQUIRED") {
                    return;
                }

                console.error(
                    "Save product error:",
                    error
                );

                alert(
                    error.message ||
                    "Failed to save product."
                );
            } finally {
                saveButton.disabled = false;
            }
        }


        // =========================================
        // LOAD PRODUCTS
        // =========================================
        async function loadProducts() {
            const tableBody =
                document.getElementById(
                    "productsTableBody"
                );

            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="pos-loading">
                        Loading products...
                    </td>
                </tr>
            `;

            try {
                const response =
                    await apiRequest(PRODUCTS_API, {
                        headers: {
                            Accept: "application/json"
                        }
                    });

                const result =
                    await readApiResponse(response);

                if (!response.ok) {
                    throw new Error(
                        result.message ||
                        `Failed to load products (HTTP ${response.status}).`
                    );
                }

                const products = Array.isArray(result)
                    ? result
                    : Array.isArray(result.products)
                        ? result.products
                        : Array.isArray(result.data)
                            ? result.data
                            : [];

                allProducts = products;

                displayProducts(allProducts);
            } catch (error) {
                if (error.message === "LOGIN_REQUIRED") {
                    return;
                }

                console.error(
                    "Product loading error:",
                    error
                );

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="pos-empty">
                            Failed to load products.
                            Check the backend and login session.
                        </td>
                    </tr>
                `;
            }
        }


        // =========================================
        // DISPLAY PRODUCTS
        // =========================================
        function displayProducts(products) {
            const tableBody =
                document.getElementById(
                    "productsTableBody"
                );

            tableBody.replaceChildren();

            if (!products.length) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="7" class="pos-empty">
                            No products found.
                        </td>
                    </tr>
                `;

                return;
            }

            const role = getCurrentRole();

            const canEdit = [
                "ADMIN",
                "MANAGER"
            ].includes(role);

            const canDelete = role === "ADMIN";

            products.forEach(product => {
                const row =
                    document.createElement("tr");

                const stock =
                    Number(product.stockQuantity) || 0;

                const status =
                    product.status || "ACTIVE";

                const statusClass =
                    status === "ACTIVE"
                        ? "pos-status-paid"
                        : "pos-status-danger";

                // Product name.
                const nameCell =
                    document.createElement("td");

                const strong =
                    document.createElement("strong");

                strong.textContent = product.name || "";

                nameCell.appendChild(strong);

                // SKU.
                const skuCell =
                    document.createElement("td");

                skuCell.textContent = product.sku || "";

                // Category.
                const categoryCell =
                    document.createElement("td");

                categoryCell.textContent =
                    product.Category
                        ? product.Category.name
                        : "Unknown";

                // Selling price.
                const priceCell =
                    document.createElement("td");

                priceCell.textContent =
                    `₦${Number(
                        product.sellingPrice || 0
                    ).toLocaleString()}`;

                // Stock.
                const stockCell =
                    document.createElement("td");

                stockCell.textContent = String(stock);

                // Status.
                const statusCell =
                    document.createElement("td");

                const statusSpan =
                    document.createElement("span");

                statusSpan.className =
                    `pos-status ${statusClass}`;

                statusSpan.textContent = status;

                statusCell.appendChild(statusSpan);

                // Role-based action buttons.
                const actionCell =
                    document.createElement("td");

                if (!canEdit && !canDelete) {
                    actionCell.textContent = "View only";
                } else {
                    const actionWrapper =
                        document.createElement("div");

                    actionWrapper.style.display = "flex";
                    actionWrapper.style.flexWrap = "wrap";
                    actionWrapper.style.gap = "6px";

                    if (canEdit) {
                        const editButton =
                            document.createElement("button");

                        editButton.type = "button";
                        editButton.className =
                            "pos-btn pos-btn-primary";

                        editButton.textContent = "Edit";

                        editButton.addEventListener(
                            "click",
                            () => editProduct(product.id)
                        );

                        actionWrapper.appendChild(
                            editButton
                        );
                    }

                    if (canDelete) {
                        const deleteButton =
                            document.createElement("button");

                        deleteButton.type = "button";
                        deleteButton.className =
                            "pos-btn pos-btn-danger";

                        deleteButton.textContent = "Delete";

                        deleteButton.addEventListener(
                            "click",
                            () => deleteProduct(product.id)
                        );

                        actionWrapper.appendChild(
                            deleteButton
                        );
                    }

                    actionCell.appendChild(
                        actionWrapper
                    );
                }

                row.append(
                    nameCell,
                    skuCell,
                    categoryCell,
                    priceCell,
                    stockCell,
                    statusCell,
                    actionCell
                );

                tableBody.appendChild(row);
            });
        }


        // =========================================
        // FILTER PRODUCTS
        // =========================================
        function filterProducts() {
            const search =
                document.getElementById(
                    "searchProduct"
                ).value.toLowerCase().trim();

            const filteredProducts =
                allProducts.filter(product => {
                    const name =
                        (product.name || "").toLowerCase();

                    const sku =
                        (product.sku || "").toLowerCase();

                    return (
                        name.includes(search) ||
                        sku.includes(search)
                    );
                });

            displayProducts(filteredProducts);
        }


        // =========================================
        // PREVIEW PRODUCT IMAGE
        // =========================================
        function previewProductImage() {
            const imageInput =
                document.getElementById(
                    "productImage"
                );

            const imagePreview =
                document.getElementById(
                    "imagePreview"
                );

            const file = imageInput.files[0];

            if (!file) {
                imagePreview.style.display = "none";
                imagePreview.src = "";
                return;
            }

            if (!file.type.startsWith("image/")) {
                alert("Please select an image file.");

                imageInput.value = "";
                imagePreview.style.display = "none";
                imagePreview.src = "";

                return;
            }

            if (imagePreview.dataset.objectUrl) {
                URL.revokeObjectURL(
                    imagePreview.dataset.objectUrl
                );

                delete imagePreview.dataset.objectUrl;
            }

            const imageUrl =
                URL.createObjectURL(file);

            imagePreview.dataset.objectUrl = imageUrl;
            imagePreview.src = imageUrl;
            imagePreview.style.display = "block";
        }


        // =========================================
        // DELETE PRODUCT — ADMIN ONLY IN UI
        // BACKEND ALSO ENFORCES PERMISSIONS
        // =========================================
        async function deleteProduct(productId) {
            if (getCurrentRole() !== "ADMIN") {
                alert(
                    "Only Admin can delete products."
                );
                return;
            }

            const confirmed = confirm(
                "Are you sure you want to delete this product?"
            );

            if (!confirmed) {
                return;
            }

            try {
                const response = await apiRequest(
                    `${PRODUCTS_API}/${encodeURIComponent(productId)}`,
                    {
                        method: "DELETE",
                        headers: {
                            Accept: "application/json"
                        }
                    }
                );

                const data =
                    await readApiResponse(response);

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        "Failed to delete product."
                    );
                }

                alert(
                    data.message ||
                    "Product deleted successfully."
                );

                await loadProducts();
            } catch (error) {
                if (error.message === "LOGIN_REQUIRED") {
                    return;
                }

                console.error(
                    "Product delete error:",
                    error
                );

                alert(
                    error.message ||
                    "Product delete failed."
                );
            }
        }


        // =========================================
        // EDIT PRODUCT — ADMIN / MANAGER
        // =========================================
        async function editProduct(productId) {
            if (!["ADMIN", "MANAGER"].includes(getCurrentRole())) {
                alert(
                    "You do not have permission to edit products."
                );
                return;
            }

            try {
                const url =
                    `${PRODUCTS_API}/${encodeURIComponent(productId)}`;

                const response =
                    await apiRequest(url, {
                        headers: {
                            Accept: "application/json"
                        }
                    });

                const data =
                    await readApiResponse(response);

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        `HTTP Error ${response.status}`
                    );
                }

                const product =
                    data.product || data.data || data;

                await loadCategories();

                document.getElementById(
                    "productForm"
                ).style.display = "block";

                document.getElementById(
                    "productFormTitle"
                ).textContent = "Edit Product";

                document.getElementById(
                    "editingProductId"
                ).value = product.id;

                document.getElementById(
                    "productName"
                ).value = product.name || "";

                document.getElementById(
                    "productSku"
                ).value = product.sku || "";

                document.getElementById(
                    "productCategory"
                ).value = String(
                    product.categoryId || ""
                );

                document.getElementById(
                    "buyingPrice"
                ).value = product.costPrice ?? "";

                document.getElementById(
                    "sellingPrice"
                ).value = product.sellingPrice ?? "";

                document.getElementById(
                    "openingStock"
                ).value = product.stockQuantity ?? "";

                document.getElementById(
                    "productImage"
                ).value = "";

                const preview =
                    document.getElementById(
                        "imagePreview"
                    );

                if (preview.dataset.objectUrl) {
                    URL.revokeObjectURL(
                        preview.dataset.objectUrl
                    );

                    delete preview.dataset.objectUrl;
                }

                preview.src = "";
                preview.style.display = "none";
            } catch (error) {
                if (error.message === "LOGIN_REQUIRED") {
                    return;
                }

                console.error(
                    "Product edit error:",
                    error
                );

                alert(
                    error.message ||
                    "Failed to load product for editing."
                );
            }
        }


        // =========================================
        // INITIALIZE
        // =========================================
        document.addEventListener(
            "DOMContentLoaded",
            async function () {
                if (typeof initPOSLayout === "function") {
                    initPOSLayout("Products");
                }

                configureProductPermissions();

                await Promise.all([
                    loadCategories(),
                    loadProducts()
                ]);
            }
        );
    </script>
</body>
</html>
